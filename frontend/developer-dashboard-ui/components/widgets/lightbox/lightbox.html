  <div class="ui-lightbox-container">
    <div style="background: var(--ui-primary-color); width: 400px; height: 260px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-family: var(--ui-font-family);">
      [ Screenshot Image Target ]

    <div class="ui-lightbox-caption">Test Execution Failure Screenshot — Chrome 118</div>
  </div>
</div>
