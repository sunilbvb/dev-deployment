<!-- Text Input Field -->
<div class="ui-field">
  <label class="ui-label">Project Name</label>
  <input type="text" class="ui-input" placeholder="e.g. Dashboard Core" />
  <span class="ui-help-text">Enter a unique descriptive name.</span>
</div>

<!-- Search Input Group -->
<div class="ui-field">
  <label class="ui-label">Search Repository</label>
  <div class="ui-input-group">
    <input type="text" class="ui-input" placeholder="Search..." />
    <button class="ui-button" data-variant="primary" style="height: auto;">Go</button>
  </div>
</div>

<!-- Select Dropdown Field -->
<div class="ui-field">
  <label class="ui-label">Category</label>
  <select class="ui-select">
    <option value="ui">UI / UX</option>
    <option value="api">API / Backend</option>
    <option value="performance">Performance</option>
  </select>
</div>

<!-- Error State Field -->
<div class="ui-field">
  <label class="ui-label">Issue Key</label>
  <input type="text" class="ui-input" data-variant="error" value="INVALID_KEY" />
  <span class="ui-help-text" data-variant="error">Invalid key format (e.g., APP-102).</span>
</div>

<!-- Textarea Field -->
<div class="ui-field">
  <label class="ui-label">Description & Notes</label>
  <textarea class="ui-textarea" placeholder="Describe details..."></textarea>
</div>
