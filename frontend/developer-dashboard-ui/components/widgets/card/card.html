<!-- Standard Card -->
<div class="ui-card">
  <div class="ui-card-header">
    <h3 class="ui-card-title">Card Header</h3>
    <span class="ui-badge" data-variant="primary">Active</span>
  </div>
  <div class="ui-card-body">
    <p>This is a standard card container with a header, structured body, and footer actions.</p>
  </div>
  <div class="ui-card-footer">
    <button class="ui-button" data-variant="ghost">Cancel</button>
    <button class="ui-button" data-variant="primary">Confirm</button>
  </div>
</div>

<!-- Interactive Accent Card -->
<div class="ui-card" data-variant="interactive">
  <div class="ui-card-header">
    <h3 class="ui-card-title">Interactive Accent Card</h3>
  </div>
  <div class="ui-card-body">
    <p>Clickable card container with elevation shadow on hover.</p>
  </div>
</div>

<!-- Metrics Card -->
<div class="ui-card">
  <div class="ui-card-header">
    <h3 class="ui-card-title">Monthly Revenue</h3>
    <span class="ui-badge" data-variant="success">+12%</span>
  </div>
