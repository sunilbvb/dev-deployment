<!-- Checkboxes -->
<div style="margin-bottom: 16px;">
  <label class="ui-control">
    <input type="checkbox" class="ui-checkbox" checked />
    Checkbox checked
  </label>
  <label class="ui-control">
    <input type="checkbox" class="ui-checkbox" />
    Checkbox unchecked
  </label>
</div>

<!-- Radios -->
<div style="margin-bottom: 16px;">
  <label class="ui-control">
    <input type="radio" name="radio-demo" class="ui-radio" checked />
    Radio A
  </label>
  <label class="ui-control">
    <input type="radio" name="radio-demo" class="ui-radio" />
    Radio B
  </label>
</div>

<!-- Toggles -->
<div>
  <label class="ui-control">
    <input type="checkbox" class="ui-toggle" checked />
    <span style="margin-left: 8px;">Toggle on</span>
  </label>
  <label class="ui-control">
    <input type="checkbox" class="ui-toggle" />
    <span style="margin-left: 8px;">Toggle off</span>
  </label>
</div>
