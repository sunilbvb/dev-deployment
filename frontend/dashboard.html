<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=http://localhost:18112/">
    <title>dev-deployment</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0b1020;
            color: #e5edf8;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: #0b1020;
        }

        main {
            width: min(520px, calc(100vw - 40px));
            padding: 28px;
            border: 1px solid #26334d;
            border-radius: 12px;
            background: #111827;
            box-shadow: 0 18px 60px rgba(0, 0, 0, 0.32);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 24px;
            line-height: 1.2;
        }

        p {
            margin: 0 0 18px;
            color: #9aa7bd;
            line-height: 1.5;
        }

        code {
            display: block;
            margin: 14px 0 18px;
            padding: 12px;
            border-radius: 8px;
            background: #060a13;
            color: #c7d2fe;
            font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 13px;
            white-space: pre-wrap;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 36px;
            padding: 0 14px;
            border-radius: 7px;
            background: #3b82f6;
            color: white;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <h1>Deployment Console</h1>
        <p>The standalone deployment app runs from its local server, just like the Git standalone app. Start it first, then open the local URL.</p>
        <code>cd /path/to/dev-deployment
./start.sh</code>
        <a href="http://localhost:18112/">Open Deployment Console</a>
    </main>
</body>
</html>
