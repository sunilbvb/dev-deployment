<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.03); opacity: 1; }
      }
      .cursor { animation: blink 1s infinite; }
      .badge-pulse { animation: pulse 2.5s infinite ease-in-out; }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="540" fill="url(#bg)" />

  <!-- Main Application Window -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <!-- Window Outer Shell -->
    <rect width="880" height="480" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

    <!-- Window Title Bar -->
    <rect width="880" height="42" rx="14" fill="#1e293b" />
    <rect y="28" width="880" height="14" fill="#1e293b" />
    <line x1="0" y1="42" x2="880" y2="42" stroke="#334155" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="22" cy="21" r="6" fill="#ef4444" />
    <circle cx="40" cy="21" r="6" fill="#f59e0b" />
    <circle cx="58" cy="21" r="6" fill="#10b981" />

    <!-- Title / URL Bar -->
    <rect x="220" y="9" width="440" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="440" y="25" fill="#94a3b8" font-size="12" font-family="monospace" text-anchor="middle">http://localhost:18112 — Dev Deployment Console</text>

    <!-- Top Project Tabs -->
    <g transform="translate(16, 52)">
      <rect x="0" y="0" width="160" height="32" rx="6" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1" />
      <text x="80" y="21" fill="#60a5fa" font-size="12" font-weight="bold" text-anchor="middle">📱 Flutter App (prod)</text>

      <rect x="170" y="0" width="140" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="240" y="21" fill="#94a3b8" font-size="12" text-anchor="middle">📦 React Native Admin</text>

      <rect x="320" y="0" width="120" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="380" y="21" fill="#94a3b8" font-size="12" text-anchor="middle">⚙️ Pipelines (3)</text>

      <!-- Queue Status Pill -->
      <g transform="translate(680, 2)" class="badge-pulse">
        <rect x="0" y="0" width="168" height="28" rx="14" fill="#065f46" stroke="#10b981" stroke-width="1" />
        <circle cx="16" cy="14" r="5" fill="#34d399" />
        <text x="96" y="19" fill="#a7f3d0" font-size="11" font-weight="bold" text-anchor="middle">BUILD QUEUE: READY</text>
      </g>
    </g>

    <!-- Main Dashboard Grid -->
    <!-- Left Column: Pre-flight Doctor & Build Runner -->
    <g transform="translate(16, 96)">
      <!-- App Doctor Card -->
      <rect width="550" height="74" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
      <text x="18" y="26" fill="#f8fafc" font-size="14" font-weight="bold">🩺 App Doctor Pre-Flight Diagnostics</text>
      <rect x="420" y="10" width="116" height="22" rx="11" fill="#14532d" stroke="#22c55e" stroke-width="1" />
      <text x="478" y="25" fill="#86efac" font-size="11" font-weight="bold" text-anchor="middle">12/12 PASSED ✓</text>

      <!-- Doctor Diagnostic Badges -->
      <g transform="translate(18, 42)">
        <rect x="0" y="0" width="96" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
        <text x="48" y="14" fill="#cbd5e1" font-size="10" text-anchor="middle">Flutter 3.24 ✓</text>

        <rect x="104" y="0" width="96" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
        <text x="152" y="14" fill="#cbd5e1" font-size="10" text-anchor="middle">Android SDK 34 ✓</text>

        <rect x="208" y="0" width="96" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
        <text x="256" y="14" fill="#cbd5e1" font-size="10" text-anchor="middle">Keystore Valid ✓</text>

        <rect x="312" y="0" width="96" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
        <text x="360" y="14" fill="#cbd5e1" font-size="10" text-anchor="middle">Firebase Sync ✓</text>

        <rect x="416" y="0" width="96" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
        <text x="464" y="14" fill="#cbd5e1" font-size="10" text-anchor="middle">Git Clean ✓</text>
      </g>
    </g>

    <!-- Real-time Console Log Terminal -->
    <g transform="translate(16, 180)">
      <rect width="550" height="236" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1" />
      <!-- Terminal Header -->
      <rect width="550" height="28" rx="8" fill="#0f172a" />
      <rect y="18" width="550" height="10" fill="#0f172a" />
      <line x1="0" y1="28" x2="550" y2="28" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="19" fill="#94a3b8" font-size="11" font-family="monospace">▶ LIVE EXECUTION STREAM (Job #184)</text>

      <!-- Terminal Lines -->
      <text x="16" y="52" fill="#64748b" font-size="11" font-family="monospace">[02:18:01]</text>
      <text x="96" y="52" fill="#38bdf8" font-size="11" font-family="monospace">Running pre-flight checks: Melos monorepo discovered (3 apps)</text>

      <text x="16" y="74" fill="#64748b" font-size="11" font-family="monospace">[02:18:02]</text>
      <text x="96" y="74" fill="#facc15" font-size="11" font-family="monospace">Sentinel: Release Keystore certificate valid (expires in 412 days)</text>

      <text x="16" y="96" fill="#64748b" font-size="11" font-family="monospace">[02:18:03]</text>
      <text x="96" y="96" fill="#cbd5e1" font-size="11" font-family="monospace">flutter build appbundle --flavor prod --release (PID: 49201)</text>

      <text x="16" y="118" fill="#64748b" font-size="11" font-family="monospace">[02:18:14]</text>
      <text x="96" y="118" fill="#34d399" font-size="11" font-family="monospace">Compilation completed in 11.2s (Assets: 1.2s | Gradle: 9.4s)</text>

      <text x="16" y="140" fill="#64748b" font-size="11" font-family="monospace">[02:18:15]</text>
      <text x="96" y="140" fill="#a78bfa" font-size="11" font-family="monospace">Build Size Diff: 24.2 MB (-1.4 MB, -5.5%) — Zero uncompressed assets</text>

      <text x="16" y="162" fill="#64748b" font-size="11" font-family="monospace">[02:18:16]</text>
      <text x="96" y="162" fill="#38bdf8" font-size="11" font-family="monospace">Wireless ADB: 2 test devices detected on local Wi-Fi desk</text>

      <text x="16" y="184" fill="#64748b" font-size="11" font-family="monospace">[02:18:18]</text>
      <text x="96" y="184" fill="#4ade80" font-size="11" font-family="monospace font-weight="bold">Pushing build to Pixel 7 Pro (192.168.1.45:5555)... SUCCESS ✓</text>

      <!-- Prompt Line with Blinking Cursor -->
      <text x="16" y="212" fill="#3b82f6" font-size="12" font-family="monospace">dev-deployment&gt;</text>
      <text x="134" y="212" fill="#e2e8f0" font-size="12" font-family="monospace">Artifacts ready. Webhook dispatched to #mobile-releases</text>
      <rect x="520" y="200" width="8" height="15" fill="#38bdf8" class="cursor" />
    </g>

    <!-- Right Column: Artifacts, QR Code & Device Desk -->
    <g transform="translate(582, 96)">
      <!-- Instant Install Card -->
      <rect width="282" height="184" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
      <text x="16" y="26" fill="#f8fafc" font-size="13" font-weight="bold">📱 Instant Wireless Install (QR)</text>
      
      <!-- QR Code Visual Representation -->
      <g transform="translate(16, 42)">
        <rect width="90" height="90" rx="6" fill="#ffffff" />
        <!-- QR Patterns -->
        <rect x="8" y="8" width="26" height="26" fill="#0f172a" />
        <rect x="13" y="13" width="16" height="16" fill="#ffffff" />
        <rect x="17" y="17" width="8" height="8" fill="#0f172a" />

        <rect x="56" y="8" width="26" height="26" fill="#0f172a" />
        <rect x="61" y="13" width="16" height="16" fill="#ffffff" />
        <rect x="65" y="17" width="8" height="8" fill="#0f172a" />

        <rect x="8" y="56" width="26" height="26" fill="#0f172a" />
        <rect x="13" y="61" width="16" height="16" fill="#ffffff" />
        <rect x="17" y="65" width="8" height="8" fill="#0f172a" />

        <!-- Data bits -->
        <rect x="42" y="14" width="6" height="6" fill="#0f172a" />
        <rect x="42" y="30" width="6" height="18" fill="#0f172a" />
        <rect x="56" y="44" width="14" height="6" fill="#0f172a" />
        <rect x="40" y="62" width="8" height="18" fill="#0f172a" />
        <rect x="58" y="66" width="22" height="14" fill="#0f172a" />
      </g>

      <!-- QR Details -->
      <g transform="translate(118, 46)">
        <text x="0" y="14" fill="#38bdf8" font-size="11" font-weight="bold">No cables needed</text>
        <text x="0" y="32" fill="#94a3b8" font-size="10">Scan from iPhone or</text>
        <text x="0" y="46" fill="#94a3b8" font-size="10">Android camera on Wi-Fi</text>
        <rect x="0" y="60" width="144" height="24" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
        <text x="72" y="76" fill="#60a5fa" font-size="10" font-weight="bold" text-anchor="middle">⬇ Download APK (24MB)</text>
      </g>

      <line x1="16" y1="144" x2="266" y2="144" stroke="#334155" stroke-width="1" />
      <text x="16" y="166" fill="#94a3b8" font-size="10">Apple OTA Manifest: </text>
      <text x="122" y="166" fill="#10b981" font-size="10" font-family="monospace">itms-services://</text>
    </g>

    <!-- Right Column Bottom: Connected Wireless Devices -->
    <g transform="translate(582, 292)">
      <rect width="282" height="124" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="bold">📡 Wireless ADB Desk</text>
      <text x="210" y="24" fill="#10b981" font-size="10">● 2 Online</text>

      <!-- Device 1 -->
      <g transform="translate(16, 38)">
        <rect width="250" height="34" rx="4" fill="#1e293b" />
        <circle cx="16" cy="17" r="4" fill="#22c55e" />
        <text x="28" y="16" fill="#f1f5f9" font-size="11" font-weight="bold">Google Pixel 7 Pro</text>
        <text x="28" y="28" fill="#94a3b8" font-size="9">192.168.1.45:5555 (Android 14)</text>
        <text x="234" y="22" fill="#38bdf8" font-size="10" text-anchor="end">Sync'd ✓</text>
      </g>

      <!-- Device 2 -->
      <g transform="translate(16, 78)">
        <rect width="250" height="34" rx="4" fill="#1e293b" />
        <circle cx="16" cy="17" r="4" fill="#22c55e" />
        <text x="28" y="16" fill="#f1f5f9" font-size="11" font-weight="bold">Samsung Galaxy S23</text>
        <text x="28" y="28" fill="#94a3b8" font-size="9">192.168.1.88:5555 (Android 14)</text>
        <text x="234" y="22" fill="#38bdf8" font-size="10" text-anchor="end">Sync'd ✓</text>
      </g>
    </g>

    <!-- Bottom Action Bar -->
    <g transform="translate(16, 428)">
      <rect width="848" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="16" y="25" fill="#94a3b8" font-size="11">⚡ Zero pip dependencies • Pure Python standard library • Vanilla JS frontend</text>
      <g transform="translate(720, 7)">
        <rect width="112" height="26" rx="4" fill="url(#accent-cyan)" />
        <text x="56" y="17" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">★ Star on GitHub</text>
      </g>
    </g>
  </g>
</svg>